<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Enter to Admin Page | Egypt Digital Museum</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/announcements.css">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
</head>

<body class="admin-body">

    <!-- ===== LOGIN GATE (split layout: form + brand panel) ===== -->
    <div id="adminLogin" class="admin-login">
        <div class="admin-login-grid">

            <!-- LEFT: FORM -->
            <div class="admin-login-form-panel">
                <div class="admin-login-form-inner">
                    <span class="admin-login-glyph" aria-hidden="true">𓂀</span>
                    <h1>Welcome Back</h1>
                    <p class="admin-login-subtext">Enter your admin token and password to access the dashboard.</p>

                    <form id="adminLoginForm">
                        <label class="admin-login-label" for="adminTokenInput">Admin Token</label>
                        <input type="password" id="adminTokenInput" placeholder="Enter admin token" autocomplete="off" required>

                        <label class="admin-login-label" for="adminPasswordInput">Password</label>
                        <div class="password-field">
                            <input type="password" id="adminPasswordInput" placeholder="Enter password" autocomplete="off" required>
                            <button type="button" class="password-toggle" id="passwordToggleBtn" aria-label="Show password" aria-pressed="false">👁</button>
                        </div>

                        <label class="remember-row">
                            <input type="checkbox" id="rememberMeInput">
                            Remember Me
                        </label>

                        <button type="submit" class="btn btn-primary admin-login-submit">Unlock</button>
                        <p class="admin-login-error hidden" id="adminLoginError">Incorrect token or password. Try again.</p>
                    </form>

                    <div class="admin-login-footer">
                        <span>© 2026 Egypt Digital Museum</span>
                        <a href="index.html">← Back to Site</a>
                    </div>
                </div>
            </div>

            <!-- RIGHT: BRAND PANEL -->
            <div class="admin-login-brand" aria-hidden="true">
                <div class="admin-login-brand-content">
                    <p class="admin-login-brand-eyebrow">A Digital Journey Through History</p>
                    <h2>Egypt Digital<br>Museum</h2>
                    <p class="admin-login-brand-tagline">Ancient Civilization × Future Technology</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/collection.js"></script>
    <script>
        // IntersectionObserver for scroll reveals
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll(
            '.reveal-up, .reveal-left, .reveal-right, .reveal-scale, .stagger-item, .reveal'
        ).forEach((el, i) => {
            el.style.transitionDelay = `${(i % 3) * 0.15}s`;
            observer.observe(el);
        });
    </script>

</body>
</html>
